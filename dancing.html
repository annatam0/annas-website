<script>
  const dropdown = document.querySelector(".dropdown");
  const navLinks = document.querySelector(".nav-links");
  dropdown.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  }); // Close menu when clicking on a link document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { navLinks.classList.remove('active'); }); });
</script>
