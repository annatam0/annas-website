<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Anna's Website</title>
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a href="#" class="logo"><img src="logo.PNG" class="logo-img" /></a>
        <ul class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="singing.html">Singing</a>
          <a href="dancing.html">Dancing</a>
          <a href="piano.html">Piano</a>
          <a href="contacts.html">Contacts</a>
          <a href="#"
        id="theme-toggle"><i class="fa fa-moon"></i> Mode</a>
        </ul>
        <button class="dropdown">☰</button>
      </div>
    </nav>
    <div class="slide contact-bg" >
      <div class="filter">
        <h1>Contacts</h1>
        <a class="btn" href="https://www.youtube.com/" target="_blank"
          >Get Started</a
        >
      </div>
    </div>
  
    <div class="container fc">
      <h2 class="section-title">Contact me</h2>
      <form>
        <label for="name" class="pt">Full name</label>
        <input type="text" id="name" placeholder="enter your name">
         <label for="email" class="pt">Email Address</label>
        <input type="text" id="email" placeholder="enter your name">
         <label for="message" class="pt">Your message</label>
        <textarea name="message" rows="5"></textarea>
        <button class="submit-btn">submit</button>
      </form>
    </div>
  </body>
</html>
<script>
  const dropdown = document.querySelector(".dropdown");
  const navLinks = document.querySelector(".nav-links");
  dropdown.addEventListener("click", () => {
    navLinks.classList.toggle("active");
  }); // Close menu when clicking on a link document.querySelectorAll('.nav-links a').forEach(link => { link.addEventListener('click', () => { navLinks.classList.remove('active'); }); });
</script>
<script src="js/theme.js"></script>
